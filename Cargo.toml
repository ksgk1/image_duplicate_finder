[package]
name = "image_duplicates"
version = "0.4.0"
edition = "2024"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
eframe = { version = "0.31", features = ["default"] }
egui_extras = { version = "0.31", features = ["default", "file", "image"] }
image = { version = "0.25.2", features = ["jpeg", "png", "rayon", "webp"] } # 0.25.1 for egui_extras
rfd = { version = "0.15" }
rayon = "1.10"
color-eyre = "0.6"
crossbeam = "0.8"
itertools = "0.14"
tracing = { version = "0.1" }
tracing-subscriber = { version = "0.3", features = ["env-filter"]}

[dev-dependencies]
pretty_assertions = "1.4"

[lints.clippy]
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
cast_precision_loss = "allow"
cast_sign_loss = "allow"
#too_many_lines = "allow"

[profile.release]
codegen-units = 1 # this will slow down the built, but give a 15% increase in performance.
opt-level = 3
strip = "full"
lto = "fat"
panic = "abort"

[profile.dev.package.backtrace]
opt-level = 3
